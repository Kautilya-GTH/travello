# Travello look — same palette and font as the team's Lovable prototype.
# Only [theme] is set, so the app stays in this one light look.
[theme]
base = "light"
primaryColor = "#12A6A6"             # travello teal (buttons, chips, links)
linkColor = "#0E8585"
backgroundColor = "#FFF7ED"          # warm cream page
secondaryBackgroundColor = "#E6F4F1" # mist: inputs, chat bubbles
textColor = "#243447"                # travello ink
borderColor = "#CFE6E1"              # travello line
font = "'Trebuchet MS', 'Segoe UI', sans-serif"
baseRadius = "medium"
